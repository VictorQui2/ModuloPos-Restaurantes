<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>POS · Fogón</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #0f0a08;
    font-family: 'DM Sans', system-ui, sans-serif;
    color: #f4ebd9;
    display: grid; place-items: center;
    min-height: 100vh;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

  /* phone shell */
  .phone-frame {
    width: 392px; height: 800px;
    background: #16110d;
    border-radius: 48px; padding: 12px; box-sizing: border-box;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.6),
      0 0 0 1.5px rgba(0,0,0,0.5) inset,
      0 1px 0 rgba(255,255,255,0.08) inset;
    flex-shrink: 0;
  }
  .phone-screen {
    width: 100%; height: 100%; border-radius: 38px;
    overflow: hidden; position: relative;
    background: #1f1814;
  }
  .phone-status {
    position: absolute; top: 0; left: 0; right: 0; height: 38px;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 24px 6px; z-index: 30;
    font: 600 13px/1 -apple-system, "SF Pro", system-ui;
    color: #f4ebd9;
    pointer-events: none;
  }
  .phone-notch {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 30px; background: #000; border-radius: 999px; z-index: 40;
  }
  .phone-content {
    position: absolute; top: 38px; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .phone-home {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    width: 130px; height: 4px; border-radius: 2px;
    background: rgba(244,235,217,0.6); z-index: 30;
  }
  .phone-content *::-webkit-scrollbar { display: none; }
  .phone-content * { scrollbar-width: none; }

  /* responsive — small viewports */
  @media (max-width: 460px) {
    body { background: #1f1814; }
    .phone-frame { width: 100vw; height: 100vh; border-radius: 0; padding: 0; box-shadow: none; }
    .phone-screen { border-radius: 0; }
    .phone-status { padding-top: max(env(safe-area-inset-top, 0), 8px); height: auto; padding-bottom: 6px; }
    .phone-notch { display: none; }
    .phone-content { top: 34px; }
    .phone-home { display: none; }
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="helpers.jsx"></script>
<script type="text/babel" src="app-store.jsx"></script>
<script type="text/babel" src="app-products.jsx"></script>
<script type="text/babel" src="app-admin.jsx"></script>

<script type="text/babel" data-presets="env,react">
  const { useStore, Actions } = window.POS_STORE;
  const T = window.TX;
  const { Ico } = window.POS_HELPERS;

  function StatusBar() {
    return (
      <div className="phone-status">
        <span>14:30</span>
        <div style={{ display: 'flex', gap: 5, alignItems: 'center', opacity: 0.85 }}>
          <svg width="15" height="10" viewBox="0 0 19 12">
            <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill="currentColor"/>
            <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill="currentColor"/>
            <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill="currentColor"/>
            <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill="currentColor"/>
          </svg>
          <svg width="20" height="10" viewBox="0 0 27 13">
            <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="currentColor" strokeOpacity="0.5" fill="none"/>
            <rect x="2" y="2" width="17" height="9" rx="2" fill="currentColor"/>
          </svg>
        </div>
      </div>
    );
  }

  function BottomNav() {
    const [s] = useStore();
    const items = [
      { id: 'productos', label: 'Carta',  icon: 'menu' },
      { id: 'admin',     label: 'Admin', icon: 'admin' },
    ];
    return (
      <div style={{
        flexShrink: 0, borderTop: `1px solid ${T.line}`, background: T.bg2,
        display: 'flex', padding: '4px 4px 8px',
      }}>
        {items.map((it) => {
          const active = s.tab === it.id;
          return (
            <button key={it.id} onClick={() => Actions.setTab(it.id)} style={{
              flex: 1, padding: '8px 4px',
              background: 'transparent', border: 'none', cursor: 'pointer',
              display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3,
              color: active ? T.accent : T.muted,
            }}>
              {it.icon === 'menu' ? (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round">
                  <path d="M5 4h14a1 1 0 0 1 1 1v15a1 1 0 0 1-1.6.8L12 16.5l-6.4 4.3A1 1 0 0 1 4 20V5a1 1 0 0 1 1-1z"/>
                  <line x1="8" y1="9" x2="16" y2="9"/>
                  <line x1="8" y1="12.5" x2="13" y2="12.5"/>
                </svg>
              ) : (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <rect x="3" y="4" width="18" height="16" rx="2"/>
                  <line x1="3" y1="9" x2="21" y2="9"/>
                  <circle cx="7" cy="6.5" r="0.6" fill="currentColor"/>
                  <line x1="7" y1="13" x2="17" y2="13"/>
                  <line x1="7" y1="16.5" x2="13" y2="16.5"/>
                </svg>
              )}
              <span style={{
                fontFamily: T.serif, fontSize: 11.5,
                fontStyle: active ? 'italic' : 'normal',
                fontWeight: active ? 500 : 400,
              }}>{it.label}</span>
            </button>
          );
        })}
      </div>
    );
  }

  function App() {
    const [s] = useStore();
    return (
      <div className="phone-frame">
        <div className="phone-screen">
          <StatusBar />
          <div className="phone-notch" />
          <div className="phone-content">
            <div style={{ flex: 1, position: 'relative', overflow: 'hidden' }}>
              {s.tab === 'productos' ? <window.ProductsScreen /> : <window.AdminScreen />}
            </div>
            <BottomNav />
          </div>
          <div className="phone-home" />
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
